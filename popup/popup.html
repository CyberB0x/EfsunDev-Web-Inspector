<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EfsunDev Web Inspector</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >
</head>

<body>

    <main class="app">

        <header class="header">
            <h1>EfsunDev Web Inspector</h1>
            <p>Website Analysis</p>
        </header>


        <section class="page-info">

            <span>Current page</span>

            <strong id="page-title">
                Loading...
            </strong>

            <small id="page-url"></small>

        </section>


        <section class="score-section">

            <p>SEO SCORE</p>

            <div id="seo-score">
                --
            </div>

            <span>/ 100</span>

        </section>


        <section>

            <h2>SEO Analysis</h2>

            <div id="seo-checks">
                Analyzing page...
            </div>

        </section>

    </main>


    <script src="popup.js"></script>

</body>
</html>
